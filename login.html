<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscriber login | PaperNest</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><script>tailwind={config:{darkMode:'class'}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"><script>try{if(localStorage.getItem('papernest_theme')==='dark'||(!localStorage.getItem('papernest_theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script><script src="https://unpkg.com/lucide@latest"></script><script defer src="js/main.js"></script><script defer src="js/auth.js"></script></head><body><div id="site-nav"></div><main class="auth-wrap"><section class="card auth-card"><span class="eyebrow">Welcome back</span><h1>Subscriber sign in</h1><p class="meta">Manage your delivery, subscriptions and travel holds.</p><form id="login-form" style="margin-top:22px"><div class="field"><label for="identity">Email or mobile number</label><input class="input" id="identity" name="identity" required autocomplete="username" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" required autocomplete="current-password" minlength="4"></div><label class="meta"><input type="checkbox" name="remember" checked> Remember me</label><button class="btn btn-primary">Sign in</button><button type="button" class="btn btn-secondary" onclick="PN.toast('Password reset help: call (555) 014-2048')">Forgot password?</button></form><p class="meta" style="margin-top:20px">New to PaperNest? <a href="signup.html">Create an account</a></p><p class="form-note">Demo sign-in: enter any email/mobile and password. No payment or backend is connected.</p></section></main><div id="site-footer"></div><script>window.addEventListener('load',()=>lucide.createIcons())</script></body></html>
