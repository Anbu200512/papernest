<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account | PaperNest</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><script>tailwind={config:{darkMode:'class'}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"><script>try{if(localStorage.getItem('papernest_theme')==='dark'||(!localStorage.getItem('papernest_theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script><script src="https://unpkg.com/lucide@latest"></script><script defer src="js/main.js"></script><script defer src="js/auth.js"></script></head><body><div id="site-nav"></div><main class="auth-wrap"><section class="card auth-card"><span class="eyebrow">A better morning awaits</span><h1>Create your account</h1><p class="meta">Set up your doorstep delivery in just a moment.</p><form id="signup-form" class="form-grid" style="margin-top:20px"><p class="form-section-title">Account details</p><div class="field full"><label for="name">Full name</label><input id="name" name="name" class="input" required minlength="2" autocomplete="name" placeholder="e.g. Alex Morgan"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" class="input" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="field"><label for="mobile">Mobile number</label><input id="mobile" name="mobile" class="input" type="tel" required pattern="[0-9+() .-]{7,20}" autocomplete="tel" placeholder="+1 555 014 2048"></div><div class="field"><label for="password">Password</label><input id="password" name="password" class="input" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"><span class="field-hint">Use 6 or more characters.</span></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" name="confirm" class="input" type="password" required minlength="6" autocomplete="new-password" placeholder="Re-enter your password"></div><div class="field full"><button class="btn btn-primary">Create account</button></div></form><p class="meta">Already a subscriber? <a href="login.html">Sign in</a></p></section></main><div id="site-footer"></div><script>window.addEventListener('load',()=>lucide.createIcons())</script></body></html>
