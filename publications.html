<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publications | PaperNest</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><script>tailwind={config:{darkMode:'class'}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/styles.css"><script>try{if(localStorage.getItem('papernest_theme')==='dark'||(!localStorage.getItem('papernest_theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script><script src="https://unpkg.com/lucide@latest"></script><script defer src="js/main.js"></script><script defer src="js/publications.js"></script></head><body><div id="site-nav"></div><main class="container"><header class="page-heading"><span class="eyebrow">Our publication shelf</span><h1>Something good to read.</h1><p>Explore trusted newspapers and magazines selected for our community, delivered right to your door.</p></header><div class="filters"><input class="input" id="pub-search" placeholder="Search publications…" aria-label="Search publications"><select id="lang-filter" class="select"><option value="All">All languages</option><option>English</option><option>French</option></select><select id="freq-filter" class="select"><option value="All">All frequencies</option><option>Daily</option><option>Weekly</option><option>Monthly</option></select><select id="price-sort" class="select"><option value="">Sort by price</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="filters" id="category-filter"><button class="btn btn-primary btn-sm" data-category="All">All</button><button class="btn btn-secondary btn-sm" data-category="Daily Newspapers">Daily Newspapers</button><button class="btn btn-secondary btn-sm" data-category="Weekly Newspapers">Weekly Newspapers</button><button class="btn btn-secondary btn-sm" data-category="Business">Business</button><button class="btn btn-secondary btn-sm" data-category="Sports">Sports</button><button class="btn btn-secondary btn-sm" data-category="Entertainment">Entertainment</button><button class="btn btn-secondary btn-sm" data-category="Technology">Technology</button><button class="btn btn-secondary btn-sm" data-category="Lifestyle">Lifestyle</button><button class="btn btn-secondary btn-sm" data-category="Children">Children</button><button class="btn btn-secondary btn-sm" data-category="Regional Publications">Regional</button></div><div id="publication-list" class="grid grid-3" style="padding-bottom:64px"></div></main><div class="modal" id="pub-modal" role="dialog" aria-modal="true"><div class="modal-card"><button class="icon-btn modal-close" data-close-modal aria-label="Close"><i data-lucide="x"></i></button><div class="modal-content" id="modal-content"></div></div></div><div id="site-footer"></div><script>window.addEventListener('load',()=>lucide.createIcons())</script></body></html>
